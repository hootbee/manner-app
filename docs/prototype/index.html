<title>매너핏 프로토타입</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column — header with progress, one question card, feedback under it. Street scenes use their own material tokens. */
:root {
  --bg: #eef1ee; --surface: #ffffff; --ink: #1c2420; --muted: #5a6760; --line: #d4dbd6;
  --accent: #1f6f5c; --accent-ink: #ffffff;

  --me: #1f6f5c; --them: #c4610f; --token-ink: #ffffff;
  --asphalt: #4b5352; --lane: #f1f1e8; --pave: #e6dfd2; --pave-line: #cdc4b3;
  --wall: #b8b1a5; --window: #8ea2b2; --step: #dad4c8; --step-edge: #a39b8d;
  --spot-fill: #ffffffd9; --stage: #dfe3e0;
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #1a201d; --ink: #e5ebe7; --muted: #9aa8a1; --line: #2c3631;
  --accent: #5bc3a3; --accent-ink: #0c1a15;
  --good: #5ccc8a; --ok: #e2b04c; --bad: #f07a62;
  --me: #5bc3a3; --them: #f0a24a; --token-ink: #0c1a15;
  --asphalt: #2a302f; --lane: #9ea49e; --pave: #3a3832; --pave-line: #4b4840;
  --wall: #575249; --window: #3e5060; --step: #3f3b34; --step-edge: #6b6558;
  --spot-fill: #1a201dd9; --stage: #0a0d0c; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1a201d; --ink: #e5ebe7; --muted: #9aa8a1; --line: #2c3631;
  --accent: #5bc3a3; --accent-ink: #0c1a15;
  --good: #5ccc8a; --ok: #e2b04c; --bad: #f07a62;
  --me: #5bc3a3; --them: #f0a24a; --token-ink: #0c1a15;
  --asphalt: #2a302f; --lane: #9ea49e; --pave: #3a3832; --pave-line: #4b4840;
  --wall: #575249; --window: #3e5060; --step: #3f3b34; --step-edge: #6b6558;
  --spot-fill: #1a201dd9; --stage: #0a0d0c; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.app { max-width: 480px; margin: 0 auto; padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.25; margin: 0; text-wrap: balance; }
.progress-row { display: flex; align-items: center; gap: 10px; }
.progress { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.count { font-family: var(--font-display); font-size: 16px; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 3.2em; text-align: right; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.fmt { border-color: var(--accent); color: var(--accent); }
.prompt { font-size: 17px; font-weight: 600; margin: 0; text-wrap: pretty; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
svg.scene { width: 100%; height: auto; display: block; border-radius: 12px; }

.spot:hover circle.ring, .spot:focus-visible circle.ring { stroke-width: 4; }

.spot.correct circle.ring { stroke: var(--good); stroke-dasharray: none; stroke-width: 4; }
.spot.wrong circle.ring { stroke: var(--bad); stroke-dasharray: none; stroke-width: 4; }
.spot-label { font-size: 11px; font-weight: 600; text-anchor: middle; font-family: var(--font-body); }
.token circle { stroke: var(--surface); stroke-width: 2; }
.token text { fill: var(--token-ink); font-weight: 600; text-anchor: middle; dominant-baseline: central; font-family: var(--font-body); }
.scene-label { font-size: 11px; font-weight: 600; font-family: var(--font-body); }
.legend { margin: 0; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.who { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 24px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--token-ink); }
.who.me { background: var(--me); } .who.them { background: var(--them); }
.evidence { font-size: 13.5px; flex: 1; min-width: 0; }
.evidence summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.evidence[open] { flex-basis: 100%; background: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.motto { margin: 0; font-family: var(--font-display); font-size: 18px; color: var(--accent); }
.answer { margin: 0; font-weight: 600; }
.why { margin: 0; }
.chip.retry { background: var(--them); border-color: var(--them); color: var(--token-ink); }
.evidence p { margin: 0; }
.ev-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.sources { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.sources a { color: var(--accent); font-weight: 600; overflow-wrap: anywhere; }
.sources .meta { color: var(--muted); }
.sources .loc { display: block; color: var(--muted); font-size: 12.5px; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { font: inherit; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt.best { border-color: var(--good); }
.opt.picked.ok { border-color: var(--ok); }
.opt.picked.avoid { border-color: var(--bad); }
.opt .tag { font-size: 12px; font-weight: 600; }
.opt.best .tag { color: var(--good); } .opt.ok .tag { color: var(--ok); } .opt.avoid .tag { color: var(--bad); }
.opt .note { font-size: 13px; color: var(--muted); }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ox .opt { align-items: center; text-align: center; padding: 18px 10px; }
.ox .big { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.feedback { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.verdict { font-family: var(--font-display); font-size: 22px; line-height: 1.2; }
.verdict.best { color: var(--good); } .verdict.ok { color: var(--ok); } .verdict.avoid { color: var(--bad); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.row > .btn { margin-left: auto; }
.btn { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 12px; border: none; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.score { font-family: var(--font-display); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 20px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.when { white-space: nowrap; font-weight: 600; }
td.when.soon { color: var(--bad); } td.when.later { color: var(--good); }
.table-wrap { overflow-x: auto; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
.loading { color: var(--muted); }
[hidden] { display: none !important; }
/* Device frame: shown on wide screens; on a real phone the frame disappears and the app fills the screen. */
html, body { height: 100%; }
.stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--stage); }
.device { position: relative; width: 390px; height: min(844px, calc(100dvh - 90px)); min-height: 600px; flex: none; border-radius: 56px; border: 12px solid #15171a;
  background: var(--bg); overflow: hidden; transform: translateZ(0); box-shadow: 0 0 0 2px #3a3d42, 0 30px 60px rgb(0 0 0 / .25); }
.screen { height: 100%; overflow-y: auto; padding-top: 50px; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.sb { position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 25; display: flex; justify-content: space-between; align-items: center; padding: 4px 30px 0 36px;
  font-size: 15px; font-weight: 600; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; }
.sb-icons { display: flex; gap: 6px; align-items: center; }
.sig { width: 17px; height: 11px; background: linear-gradient(to right, currentColor 0 3px, transparent 3px 4.5px, currentColor 4.5px 7.5px, transparent 7.5px 9px, currentColor 9px 12px, transparent 12px 13.5px, currentColor 13.5px); clip-path: polygon(0 75%, 100% 0, 100% 100%, 0 100%); }
.bat { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; position: relative; opacity: .9; }
.bat::after { content: ""; position: absolute; inset: 1.5px; right: 5px; background: currentColor; border-radius: 1.5px; }
.island { position: absolute; top: 11px; left: 50%; width: 122px; height: 35px; border-radius: 20px; background: #000; transform: translateX(-50%); z-index: 26; }
.homebar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .8; transform: translateX(-50%); z-index: 40; pointer-events: none; }
.device .tabbar { padding-bottom: 26px; }
.device .sheet { padding-bottom: 34px; }
.device .toast { bottom: 100px; }
.caption { margin: 0; font-size: 12px; color: var(--muted); }
@media (max-width: 500px) {
  .stage { display: block; padding: 0; min-height: 0; }
  .device { width: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
  .screen { padding-top: 0; }
  .sb, .island, .homebar, .caption, .viewer { display: none; }
  .device .tabbar { padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
  .device .sheet { padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .device .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}

.progress { position: relative; }
#ticks i { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--surface); }
.exit { font: inherit; font-size: 16px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 2px 6px; }
.btn.big { padding: 14px; font-size: 16px; }
.weekly { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: var(--bg); font-size: 14px; }
.weekly .progress > div { background: var(--them); }
.tie.big-tie { width: 20px; height: 32px; margin-right: 8px; color: var(--them); vertical-align: -2px; }
.weekly .progress { flex: none; }
.appbar { display: flex; align-items: center; gap: 8px; }
.appbar svg { width: 30px; height: 30px; border-radius: 8px; flex: none; }
.appbar b { font-family: var(--font-display); font-weight: 400; font-size: 21px; letter-spacing: -.01em; }
.appbar { position: relative; }
.gear { margin-left: auto; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: none; background: none; color: var(--muted); border-radius: 10px; cursor: pointer; }
.gear svg { width: 24px; height: 24px; fill: currentColor; }
.gear:focus-visible, .back:focus-visible { outline: 2px solid var(--ink); }
.back { align-self: flex-start; font: inherit; font-size: 14px; font-weight: 600; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; }
.set-group { display: flex; flex-direction: column; }
.set-group > small { font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 2px 4px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.set-row.disabled > span:first-child { color: var(--muted); }
.set-right { display: flex; align-items: center; gap: 10px; }
.muted { color: var(--muted); font-size: 14px; }
.switch { appearance: none; width: 42px; height: 24px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: left .2s; }
.switch:checked { background: var(--accent); } .switch:checked::after { left: 21px; }
.switch:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.account, .acc-pick { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.acc-pick { font: inherit; color: inherit; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.acc-pick:hover { border-color: var(--accent); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-weight: 600; flex: none; }
.acc-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.acc-text small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.ok-chip { border-color: var(--good); color: var(--good); white-space: nowrap; }
.guest-cta { display: flex; flex-direction: column; gap: 8px; }
.guest-cta .hint { text-align: center; }
.set-row.link { font: inherit; font-size: 15px; color: var(--ink); background: none; border: none; border-bottom: 1px solid var(--line); width: 100%; text-align: left; cursor: pointer; }
.set-row.link.danger > span:first-child { color: var(--bad); }
.btn.danger { background: var(--bad); color: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--surface); font-size: 14px; padding: 10px 16px; border-radius: 12px; max-width: calc(100% - 32px); }
.topstat { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.ts { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.ts .tie { width: 9px; height: 14px; color: var(--them); margin: 0; }
.ts .ring { width: 18px; height: 18px; }
.daytitle { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.15; text-wrap: balance; }
.hint.center { text-align: center; margin: 0; }
.hint.waiting { color: var(--accent); font-weight: 600; }
.tl { list-style: none; margin: 8px 0 4px; padding: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr); position: relative; }
.tl::before { content: ""; position: absolute; top: 37px; left: calc(50% / var(--n)); right: calc(50% / var(--n)); height: 2px; background: var(--line); }
.node { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.node .ico svg { width: 24px; height: 24px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.node .dot { width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); z-index: 1; margin: 1px 0 3px; }
.node .time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.node b { font-size: 15px; }
.node.now .dot { border: 4px solid var(--accent); }
.node.now .ico svg { stroke: var(--accent); }
.node.done .dot { background: var(--accent); border-color: var(--accent); }
.node.done b, .node.done .time { color: var(--muted); }
.node.next b { color: var(--muted); font-weight: 600; }
.sheet { max-height: 85%; overflow-y: auto; }
.viewer { display: flex; gap: 6px; padding: 4px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.viewer button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 99px; border: none; background: none; color: var(--muted); cursor: pointer; }
.viewer button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.viewer button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.fx-pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.fx-pills::-webkit-scrollbar { display: none; }
.fx-pill { font: inherit; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; cursor: pointer; flex: none; }
.fx-pill.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fx-stage { display: flex; flex-direction: column; gap: 8px; }
.fx-fb { min-height: 46px; border-radius: 12px; background: var(--bg); padding: 8px 12px; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fx-fb b.best { color: var(--good); } .fx-fb b.ok { color: var(--ok); } .fx-fb b.avoid { color: var(--bad); }
.fx-reset { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 4px 8px; cursor: pointer; flex: none; }
.fx-navrow { display: flex; gap: 8px; } .fx-navrow .btn { flex: 1; margin: 0; }
.fx-chat { background: var(--bg); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 230px; overflow-y: auto; }
.fx-who { font-size: 11px; color: var(--muted); }
.fx-b { max-width: 82%; padding: 7px 10px; border-radius: 12px; font-size: 14px; background: var(--surface); align-self: flex-start; }
.fx-b.me { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); align-self: flex-end; }
.fx-b small { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }
.fx-opts { display: flex; flex-direction: column; gap: 6px; }
.fx-opt { font: inherit; font-size: 14px; text-align: left; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
.fx-opt:hover:not(:disabled) { border-color: var(--accent); }
.fx-opt:disabled { cursor: default; opacity: .5; } .fx-opt.best { border-color: var(--good); opacity: 1; }
.fx-draft { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 15px; }
.fx-tok { border: 1.5px dashed var(--muted); border-radius: 6px; padding: 2px 6px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
.fx-tok.hit { border: 1.5px solid var(--bad); text-decoration: line-through; color: var(--bad); }
.fx-tok.fine { border-style: solid; border-color: var(--good); }
.fx-counter { font-size: 12px; color: var(--muted); }
.fx-clock { font-family: var(--font-display); font-size: 44px; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
.fx-clock small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--muted); margin-top: 4px; }
#fx-range { width: 100%; accent-color: var(--accent); }
.fx-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fx-table { position: relative; width: 100%; aspect-ratio: 1 / 0.86; background: var(--bg); border-radius: 14px; }
.fx-plate { position: absolute; left: 50%; top: 56%; width: 34%; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
.fx-slot { position: absolute; width: 58px; height: 58px; border-radius: 12px; border: 2px dashed var(--muted); transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; }
.fx-slot.over, .fx-slot.armed { border-color: var(--accent); }

<script>
const FORMAT = { position: '위치', choice: '상황 선택', ox: 'OX' };
const NS = 'http://www.w3.org/2000/svg';

const $ = (id) => document.getElementById(id);
const setCard = (...kids) => $('card').replaceChildren(...kids.filter((k) => k != null));

function el(tag, attrs = {}, kids = []) {
  const svg = ['svg','g','rect','circle','path','text','line','polygon'].includes(tag);
  const n = svg ? document.createElementNS(NS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v; else if (k === 'class') n.setAttribute('class', v); else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* Scene templates: drawing lives in code, questions only name a template and spot ids. */
const TEMPLATES = {
  sidewalk(s) {
    const m = s.mirror, X = (x, w = 0) => m ? 320 - x - w : x;
    const g = el('g');
    g.append(el('rect', { x: X(0, 70), y: 0, width: 70, height: 240, fill: 'var(--wall)' }));
    for (const wy of [18, 68, 118, 168]) for (const wx of [14, 40]) g.append(el('rect', { x: X(wx, 16), y: wy, width: 16, height: 24, rx: 2, fill: 'var(--window)' }));
    g.append(el('rect', { x: X(70, 130), y: 0, width: 130, height: 240, fill: 'var(--pave)' }));
    for (let y = 30; y < 240; y += 30) g.append(el('line', { x1: X(70), y1: y, x2: X(200), y2: y, stroke: 'var(--pave-line)', 'stroke-width': 1.5 }));
    g.append(el('rect', { x: X(200, 6), y: 0, width: 6, height: 240, fill: 'var(--step-edge)' }));
    g.append(el('rect', { x: X(206, 114), y: 0, width: 114, height: 240, fill: 'var(--asphalt)' }));
    for (let y = 6; y < 240; y += 48) g.append(el('rect', { x: X(262, 4), y, width: 4, height: 24, fill: 'var(--lane)' }));
    g.append(car(X(224, 30), 150));
    g.append(walkArrow(X(137), 228));
    g.append(el('text', { x: X(35), y: 232, 'text-anchor': 'middle', class: 'scene-label', fill: 'var(--ink)', text: '건물' }));
    g.append(el('text', { x: X(290), y: 232, 'text-anchor': 'middle', class: 'scene-label', fill: 'var(--lane)', text: '차도' }));
    return { g, spots: { inner: [X(108), 112], outer: [X(168), 112] }, labelFill: 'var(--ink)', pair: true };
  },
  alley() {
    const g = el('g');
    g.append(el('rect', { x: 36, y: 0, width: 248, height: 240, fill: 'var(--asphalt)' }));
    g.append(el('rect', { x: 0, y: 0, width: 36, height: 240, fill: 'var(--wall)' }));
    g.append(el('rect', { x: 284, y: 0, width: 36, height: 240, fill: 'var(--wall)' }));
    for (let y = 0; y < 240; y += 20) { g.append(el('line', { x1: 0, y1: y, x2: 36, y2: y, stroke: 'var(--step-edge)', 'stroke-width': 1 })); g.append(el('line', { x1: 284, y1: y, x2: 320, y2: y, stroke: 'var(--step-edge)', 'stroke-width': 1 })); }
    g.append(car(196, 168));
    for (const dx of [0, 10, 20]) g.append(el('line', { x1: 201 + dx, y1: 226, x2: 201 + dx, y2: 238, stroke: 'var(--lane)', 'stroke-width': 2, 'stroke-linecap': 'round' }));
    g.append(el('text', { x: 211, y: 160, 'text-anchor': 'middle', class: 'scene-label', fill: 'var(--lane)', text: '차가 다가옴' }));
    g.append(walkArrow(110, 228, 'var(--lane)'));
    g.append(el('text', { x: 18, y: 14, 'text-anchor': 'middle', class: 'scene-label', fill: 'var(--ink)', text: '벽' }));
    return { g, spots: { wall: [80, 96], carside: [142, 96] }, labelFill: 'var(--lane)', pair: true };
  },
  stairs(s) {
    const g = el('g');
    g.append(el('rect', { x: 0, y: 0, width: 320, height: 240, fill: 'var(--pave)' }));
    g.append(el('path', { d: 'M10,240 V202 H70 V164 H130 V126 H190 V88 H250 V50 H310 V240 Z', fill: 'var(--step)', stroke: 'var(--step-edge)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
    const up = s.direction === 'up';
    g.append(el('text', { x: 18, y: 28, class: 'scene-label', fill: 'var(--ink)', text: up ? '올라가는 중' : '내려가는 중' }));
    g.append(el('path', { d: up ? 'M100,32 L136,10 M136,10 L124,10 M136,10 L132,21' : 'M136,10 L100,32 M100,32 L112,32 M100,32 L104,21', stroke: 'var(--accent)', 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }));
    g.append(token(146, 108, s.otherLabel || '상대', 'var(--them)'));
    return { g, spots: { above: [220, 70], same: [177, 108], below: [100, 146] }, labelFill: 'var(--ink)', r: 13 };
  }
};
function car(x, y) {
  return el('g', {}, [
    el('rect', { x, y, width: 30, height: 54, rx: 8, fill: 'var(--lane)', stroke: 'var(--asphalt)', 'stroke-width': 1.5 }),
    el('rect', { x: x + 5, y: y + 8, width: 20, height: 11, rx: 3, fill: 'var(--window)' }),
    el('rect', { x: x + 5, y: y + 36, width: 20, height: 8, rx: 3, fill: 'var(--window)' })
  ]);
}
function walkArrow(x, y, color = 'var(--muted)') {
  return el('g', {}, [
    el('path', { d: `M${x},${y} V${y - 34} M${x - 7},${y - 26} L${x},${y - 34} L${x + 7},${y - 26}`, stroke: color, 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }),
    el('text', { x: x, y: y - 40, 'text-anchor': 'middle', class: 'scene-label', fill: color, text: '진행 방향' })
  ]);
}
function token(x, y, label, color) {
  return el('g', { class: 'token' }, [el('circle', { cx: x, cy: y, r: 15, fill: color }), el('text', { x, y, text: label, 'font-size': label.length > 2 ? 9 : 10.5 })]);
}

function renderPosition(s, stage, onAnswer) {
  const t = TEMPLATES[s.template](s);
  const svg = el('svg', { viewBox: '0 0 320 240', class: 'scene', role: 'group', 'aria-label': '장면 그림. 자리를 하나 고르세요.' }, [t.g]);
  const r = t.r || 16;
  const spotEls = {};
  for (const sp of s.spots) {
    const [x, y] = t.spots[sp.id];
    const g = el('g', { class: 'spot', role: 'button', tabindex: 0, 'aria-label': sp.label }, [
      el('circle', { class: 'ring', cx: x, cy: y, r }), el('text', { class: 'q', x, y, text: '?' })
    ]);
    const pick = () => { if (!svg.classList.contains('locked')) onAnswer(sp.id); };
    g.addEventListener('click', pick);
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    svg.append(g, el('text', { x, y: y + r + 14, class: 'spot-label', fill: t.labelFill, text: sp.label }));
    spotEls[sp.id] = { g, x, y };
  }
  stage.append(el('p', { class: 'legend' }, [
    el('span', { class: 'who me', text: '나' }), document.createTextNode(' 자리를 탭하세요. '),
    el('span', { class: 'who them', text: s.otherLabel }),
    document.createTextNode((hasBatchim(s.otherLabel) ? '은' : '는') + (t.pair ? ' 남은 자리로 가요.' : ' 그림에 있어요.'))
  ]), svg);
  return (chosen) => {
    svg.classList.add('locked');
    const color = 'var(--me)';
    spotEls[s.answer].g.classList.add('correct');
    if (chosen !== s.answer) spotEls[chosen].g.classList.add('wrong');
    const { x, y } = spotEls[chosen];
    spotEls[chosen].g.querySelector('text.q').remove();
    svg.append(token(x, y, s.subjectLabel, color));
    if (t.pair) {
      const other = s.spots.find((sp) => sp.id !== chosen).id;
      spotEls[other].g.querySelector('text.q').remove();
      svg.append(token(spotEls[other].x, spotEls[other].y, s.otherLabel, 'var(--them)'));
    }
    return chosen === s.answer ? 'best' : 'avoid';
  };
}

function renderChoice(s, stage, onAnswer) {
  const box = el('div', { class: 'options' });
  const btns = shuffle(s.options).map((o) => {
    const b = el('button', { class: 'opt', type: 'button' }, [el('span', { text: o.text })]);
    b.addEventListener('click', () => onAnswer(o));
    box.append(b);
    return { b, o };
  });
  stage.append(box);
  return (picked) => {
    for (const { b, o } of btns) {
      b.disabled = true;
      b.classList.add(o.grade);
      if (o === picked) b.classList.add('picked');
      if (o.grade === 'best' || o === picked) {
        b.prepend(el('span', { class: 'tag', text: o.grade === 'best' ? '가장 무난한 선택' : o.grade === 'ok' ? '괜찮은 선택' : '피해야 할 선택' }));
        if (o.note && o.grade !== 'best') b.append(el('span', { class: 'note', text: o.note }));
      }
    }
    return picked.grade;
  };
}

function renderOX(s, stage, onAnswer) {
  const box = el('div', { class: 'ox' });
  const mk = (val, big, small) => {
    const b = el('button', { class: 'opt', type: 'button' }, [el('span', { class: 'big', text: big }), el('span', { text: small })]);
    b.addEventListener('click', () => onAnswer(val));
    box.append(b);
    return b;
  };
  const bo = mk(true, 'O', '맞다'), bx = mk(false, 'X', '아니다');
  stage.append(box);
  return (val) => {
    for (const [b, v] of [[bo, true], [bx, false]]) {
      b.disabled = true;
      if (v === s.answer) b.classList.add('best');
      else if (v === val) b.classList.add('picked', 'avoid');
    }
    return val === s.answer ? 'best' : 'avoid';
  };
}

/* ---------- content: 3 layers (manners → scenarios with variation axes → days) ---------- */
const hasBatchim = (w) => { const c = w.charCodeAt(w.length - 1); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0; };
const JOSA = { 와: ['과', '와'], 과: ['과', '와'], 은: ['은', '는'], 는: ['은', '는'], 이: ['이', '가'], 가: ['이', '가'], 을: ['을', '를'], 를: ['을', '를'] };
const josa = (w, j) => w + JOSA[j][hasBatchim(w) ? 0 : 1];
function fill(v, ctx) {
  if (typeof v === 'string') return v.replace(/\{(\w+)(와|과|은|는|이|가|을|를)?\}/g, (m, k, j) => ctx[k] == null ? m : j ? josa(String(ctx[k]), j) : String(ctx[k]));
  if (Array.isArray(v)) return v.map((x) => fill(x, ctx));
  if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fill(x, ctx)]));
  return v;
}
/* One base scenario × every combination of its axes = concrete questions. No axes = one question. */
function expand(base) {
  const { vary, ...rest } = base;
  let combos = [{}];
  for (const axis of vary || []) combos = combos.flatMap((c) => axis.map((a) => ({ ...c, ...a })));
  return combos.map((c, i) => {
    const s = { ...rest, ...c, base: base.id, id: vary ? `${base.id}~${i}` : base.id };
    if (s.other) s.otherLabel = s.other;
    return fill(s, s);
  });
}

let data, pool, byManner, mannerName;
document.getElementById('exit').addEventListener('click', () => quit());
const tickClock = () => { const d = new Date(); $('sb-time').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
tickClock(); setInterval(tickClock, 30000);
document.getElementById('gear').addEventListener('click', () => renderSettings());
for (const b of document.querySelectorAll('.viewer button')) b.addEventListener('click', () => (b.dataset.view === 'formats' ? renderFormats() : leaveFormats()));
for (const b of document.querySelectorAll('#tabbar button')) b.addEventListener('click', () => (b.dataset.tab === 'home' ? renderHome : renderProfile)());
/* Bottom nav shows only on top-level screens; a running day is full-screen focus, like a lesson. */
function setNav(tab) {
  $('tabbar').hidden = !tab;
  $('appbar').hidden = !tab;
  $('gear').hidden = tab !== 'profile';
  $('topstat').hidden = tab !== 'home';
  document.body.classList.toggle('has-nav', !!tab);
  for (const b of document.querySelectorAll('#tabbar button')) b.toggleAttribute('aria-current', b.dataset.tab === tab);
}
const state = { day: 0, scene: 0, xp: 0, streak: 0, daysDone: 0, doneToday: false, seen: new Set(), attempts: [], user: null };

/* ---------- home: day overview, one button plays the whole day ---------- */
function header(eyebrow, title, progress) {
  $('pagehead').hidden = false;
  $('eyebrow').textContent = eyebrow;
  $('pname').textContent = title;
  $('progress-row').hidden = progress == null;
  if (progress != null) {

  const stamp = wel('small', { text: '보낼 시각 23:30' });

  range.addEventListener('input', () => {
    const m = at(+range.value);

function fxMatch({ stage, say }) {
  const PAIRS = [

    { k: 'done', left: '나란히 4시 방향', right: '다 먹었어요, 치워도 돼요' },

  const rights = shuffle(PAIRS).map((p) => wel('button', { class: 'fx-m', type: 'button', 'data-k': p.k }, [wel('span', { text: p.right })]));
  for (let i = 0; i < PAIRS.length; i++) wrap.append(lefts[i], rights[i]);
  wrap.append(svg);
  const draw = () => {
    svg.replaceChildren();
    const box = wrap.getBoundingClientRect();
    for (const [l, r] of links) {
      const a = l.getBoundingClientRect(), b = r.getBoundingClientRect();
      const color = finished ? (l.dataset.k === r.dataset.k ? 'var(--good)' : 'var(--bad)') : 'var(--accent)';
      svg.append(wel('line', { x1: a.right - box.left, y1: a.top + a.height / 2 - box.top, x2: b.left - box.left, y2: b.top + b.height / 2 - box.top, stroke: color, 'stroke-width': 2.5, 'stroke-linecap': 'round' }));

    const [l, r] = side === 'r' ? [pick.b, b] : [b, pick.b];

  { short: '장면 찾기', title: '장면 속 틀린 행동 찾기', chip: '찾기 · 공공장소', prompt: '지하철 칸에서 매너에 어긋난 승객 3명을 찾으세요.', hint: '20초 제한, 틀리면 −3초예요.', build: fxScene }
];
function renderFormats(i = fxIdx) {
  fxCleanup?.(); fxCleanup = null;
  fxIdx = i;
  setNav(null);
  setView('formats');
  const f = FORMATS[i];
  header(`문제 형식 ${i + 1} / ${FORMATS.length}`, f.title, null);
  const back = wel('button', { class: 'back', type: 'button', text: '‹ 앱으로', onclick: leaveFormats });
  const pills = wel('div', { class: 'fx-pills', role: 'tablist', 'aria-label': '문제 형식' }, FORMATS.map((x, j) =>
    wel('button', { class: `fx-pill${j === i ? ' on' : ''}`, type: 'button', role: 'tab', 'aria-selected': String(j === i), text: x.short, onclick: () => renderFormats(j) })));
  const stage = wel('div', { class: 'fx-stage' });
  const fbText = wel('span');
  const say = (grade, text) => fbText.replaceChildren(...[grade ? wel('b', { class: grade, text: { best: '정답 ', ok: '괜찮음 ', avoid: '아쉬움 ' }[grade] }) : null, text || ''].filter(Boolean));
  const fb = wel('div', { class: 'fx-fb', 'aria-live': 'polite' }, [fbText, wel('button', { class: 'fx-reset', type: 'button', text: '다시', onclick: () => renderFormats(i) })]);
  const prev = wel('button', { class: 'btn ghost', type: 'button', text: '‹ 이전', onclick: () => renderFormats((i + FORMATS.length - 1) % FORMATS.length) });
  const next = wel('button', { class: 'btn ghost', type: 'button', text: '다음 ›', onclick: () => renderFormats((i + 1) % FORMATS.length) });
  say(null, f.hint);
  setCard(back, pills, wel('div', { class: 'chips' }, [wel('span', { class: 'chip fmt', text: f.chip })]), wel('p', { class: 'prompt', text: f.prompt }), stage, fb, wel('div', { class: 'fx-navrow' }, [prev, next]));
  f.build({ stage, say });
  pills.querySelector('.on')?.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function leaveFormats() { fxCleanup?.(); fxCleanup = null; setView('app'); renderHome(); }
function setView(v) { for (const b of document.querySelectorAll('.viewer button')) b.setAttribute('aria-pressed', String(b.dataset.view === v)); }

/* ---------- developer menu (prototype only): pool stats and day skipping, hidden behind the version row ---------- */
function devRow() {
  const b = el('button', { class: 'set-row link', type: 'button' }, [el('span', { text: '버전' }), el('span', { class: 'muted', text: '0.1 프로토타입' })]);
  let timer = null, taps = 0, tapTimer = null;
  b.addEventListener('pointerdown', () => { timer = setTimeout(openDev, 600); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => clearTimeout(timer));
  b.addEventListener('click', () => { taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => (taps = 0), 800); if (taps >= 3) { taps = 0; openDev(); } });
  return b;
}
function openDev() {
  if (document.querySelector('.sheet-wrap')) return;
  const next = data.days[state.day + 1], playable = next && !next.locked;
  const act = (label, fn) => { const b = el('button', { class: 'btn ghost', type: 'button', text: label }); b.addEventListener('click', () => { document.querySelector('.sheet-wrap')?.remove(); fn(); }); return b; };
  sheet('개발자 메뉴', [
    el('p', { class: 'hint', text: '프로토타입 확인용이에요. 출처는 요약이며 앱 출시 전 라이선스 확인이 필요해요.' }),
    state.doneToday && playable ? act(`내일로 건너뛰기 · ${next.title}`, () => { Object.assign(state, { day: state.day + 1, scene: 0, doneToday: false }); renderHome(); }) : null,
    act('문제 형식 6종 보기', () => renderFormats(0)),
    act('처음부터 다시', () => { Object.assign(state, { day: 0, scene: 0, xp: 0, streak: 0, daysDone: 0, doneToday: false, seen: new Set(), attempts: [] }); renderHome(); }),
    poolPanel()
  ].filter(Boolean), [['닫기', 'ghost']]);
}

/* ---------- settings (sub-page of profile) ---------- */
function renderSettings() {
  setNav('profile');
  $('appbar').hidden = true;
  header('프로필', '설정', null);
  const back = el('button', { class: 'back', type: 'button', text: '‹ 프로필' });
  back.addEventListener('click', renderProfile);
  const toggle = (id, on) => el('input', { type: 'checkbox', class: 'switch', id, ...(on ? { checked: '' } : {}) });
  const row = (label, right, cls = '') => el('div', { class: `set-row ${cls}` }, [el('span', { text: label }), right]);
  const muted = (t) => el('span', { class: 'muted', text: t });
  const linkRow = (label, fn, cls = '', right = '›') => {
    const b = el('button', { class: `set-row link ${cls}`, type: 'button' }, [el('span', { text: label }), muted(right)]);
    b.addEventListener('click', fn);
    return b;
  };
  setCard(back,
    el('div', { class: 'set-group' }, [
      el('small', { text: '학습' }),
      row('학습 알림', el('label', { class: 'set-right', for: 'set-noti' }, [muted('오후 9시'), toggle('set-noti', true)])),
      row('효과음', toggle('set-sound', true)),
      row('진동', toggle('set-haptic', true))]),
    el('div', { class: 'set-group' }, [
      el('small', { text: '계정' }),
      ...(state.user ? [
        row('로그인', muted(`Google · ${state.user.email}`)),
        linkRow('로그아웃', logout),
        linkRow('회원 탈퇴', openWithdraw, 'danger')
      ] : [
        linkRow('로그인', openLogin, '', 'Google로 저장 ›'),
        row('회원 탈퇴', muted('로그인 후 가능'), 'disabled')
      ])]),
    el('div', { class: 'set-group' }, [
      el('small', { text: '정보' }),
      row('해설 오류 신고', muted('›')),
      row('개인정보처리방침', muted('›')),
      row('오픈소스 라이선스', muted('›')),
      devRow()]),
    el('p', { class: 'hint', text: '알림은 밤 10시 이후로는 설정할 수 없어요.' })
  );
}

/* No mid-day save (like Duolingo): leaving restarts the day. Answers already given stay in the attempt log. */
function quit() {
  let sheet = null;
  const leave = () => { sheet?.remove(); state.scene = 0; run = null; renderHome(); };
  if (!run || run.total === 0) return leave();
  const stay = el('button', { class: 'btn', type: 'button', text: '계속하기' });
  const out = el('button', { class: 'btn ghost', type: 'button', text: '나가기' });
  sheet = el('div', { class: 'sheet-wrap', role: 'dialog', 'aria-modal': 'true', 'aria-label': '하루 그만하기' }, [
    el('div', { class: 'sheet' }, [
      el('b', { text: '지금 나가면 오늘 하루를 처음부터 다시 해요' }),
      el('p', { class: 'hint', text: `XP ${run.xp}은 하루를 마쳐야 받아요. 이미 푼 문제는 복습 기록에 남아요.` }),
      el('div', { class: 'row' }, [out, stay])
    ])
  ]);
  stay.addEventListener('click', () => sheet.remove());
  out.addEventListener('click', leave);
  sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.remove(); });
  $('device').append(sheet);
  stay.focus();
}

fetch('content.json')
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => {
    data = d;
    pool = d.scenarios.flatMap(expand);
    byManner = new Map(d.manners.map((m) => [m.id, pool.filter((s) => s.manner === m.id)]));
    mannerName = Object.fromEntries(d.manners.map((m) => [m.id, m.name]));
    renderHome();
  })
  .catch(() => { setCard(el('p', { class: 'loading', text: '문제 파일을 불러오지 못했어요. 새로고침해 보세요.' })); });
</script>
