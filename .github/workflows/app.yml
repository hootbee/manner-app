# 앱 analyze, 테스트, 릴리스 APK 빌드. 로컬 Supabase를 띄워 sync 테스트도 skip 없이 돈다 (ADR 0005 §6)
name: app

on:
  pull_request:
    branches: [dev]
    paths:
      - app/**
      - supabase/**
      - .github/workflows/app.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2 # 로컬과 같은 버전

      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0 # db.yml과 같은 버전

      # db.yml과 같은 목록
      - run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

      # supabase status가 실패하거나 변수가 비면 멈춘다(bash -e, :?). 환경 변수 없이 skip된 채 통과하지 않는다
      - run: |
          env=$(supabase status -o env --override-name api.url=SUPABASE_URL --override-name auth.anon_key=SUPABASE_ANON_KEY --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY)
          eval "$env"; export SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          : "${SUPABASE_URL:?}" "${SUPABASE_ANON_KEY:?}" "${SUPABASE_SERVICE_ROLE_KEY:?}"
          cd app && flutter pub get && flutter analyze && flutter test

  # flutter test는 Gradle과 Kotlin 컴파일을 돌리지 않는다. 스토어에 나가는 릴리스 APK를 빌드해 플러그인 컴파일, R8, lint까지 확인한다
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2 # 로컬과 같은 버전
          cache: true

      # 릴리스 서명은 아직 디버그 키라 비밀 값이 필요 없다
      - run: cd app && flutter build apk --release
